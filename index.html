<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Verba por cliente — V4 Carvalho &amp; Co</title>
  <meta name="description" content="Acompanhamento de saldo, queima diária e dias restantes de verba em Meta Ads e Google Ads por cliente.">
  <link rel="preconnect" href="https://mzwynanvhojzyoirvxkc.supabase.co">
  <link rel="stylesheet" href="./assets/styles.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='18' fill='%23c00000'/><rect x='30' y='24' width='12' height='52' rx='3' fill='white'/><rect x='58' y='40' width='12' height='36' rx='3' fill='white'/></svg>">
</head>
<body>

  <div id="faixa-demo" class="faixa-demo oculto">
    Modo demonstração — dados fictícios, não são números reais de cliente
  </div>

  <header class="topo">
    <div class="topo-inner">
      <div class="marca-bloco">
        <span class="marca-barra" aria-hidden="true"></span>
        <div>
          <h1>Verba por cliente</h1>
          <p class="subtitulo">Meta Ads e Google Ads · saldo, queima e dias restantes</p>
        </div>
      </div>

      <div class="topo-dir">
        <span id="sync-info" class="sync-info">carregando…</span>
        <div class="abas" role="tablist" aria-label="Visões">
          <button class="aba" data-aba="global"        role="tab" aria-selected="true">Carteira</button>
          <button class="aba" data-aba="cliente"       role="tab" aria-selected="false">Por cliente</button>
          <button class="aba" data-aba="investimentos" role="tab" aria-selected="false">Investimentos</button>
          <button class="aba" data-aba="historico"     role="tab" aria-selected="false">Histórico</button>
        </div>
      </div>
    </div>
  </header>

  <main class="wrap">
    <div id="conteudo">
      <div class="vazio">Carregando…</div>
    </div>
  </main>

  <div id="tooltip" class="tooltip" role="status" aria-live="polite"></div>

  <script type="module" src="./assets/app.js"></script>
</body>
</html>
